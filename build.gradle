plugins {
    id 'java'
    id 'application'
}

// This project uses a flat `src/` layout (default package) rather than the
// Gradle-standard `src/main/java`, so point the main source set at `src`.
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = []
        }
    }
}

java {
    // Pin the JDK so the build is independent of whatever JAVA_HOME happens
    // to be installed. Gradle will locate (or download) a matching toolchain.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'SmallestAmongThreeIntegers'
}

// This is an interactive console app, so forward the terminal's stdin to the
// `run` task (Gradle does not connect stdin by default).
tasks.named('run') {
    standardInput = System.in
}

// --- Reproducible builds -----------------------------------------------------
// Make every archive (jar, distribution zip/tar) byte-for-byte identical across
// machines and over time: strip embedded timestamps and sort entries.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirPermissions { unix(0755) }
    filePermissions { unix(0644) }
}

// Keep the bytecode deterministic too.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}
